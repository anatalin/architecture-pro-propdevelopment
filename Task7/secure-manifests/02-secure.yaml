# Исправление 02-hostpath-pod.yaml: hostPath заменён на emptyDir
apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-02
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      # Обычный образ nginx запускается от root, этот работает от UID 101 и слушает порт 8080
      image: nginxinc/nginx-unprivileged:1.31-alpine
      ports:
        - containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    # Вместо каталога узла используется временный том пода
    - name: tmp
      emptyDir: {}
